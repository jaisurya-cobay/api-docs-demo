name: API docs

# Every push to main or a release tag (v*) rebuilds the docs site:
# latest (main) + one spec per release tag, shown in a version dropdown.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need all tags to rebuild old versions

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 1. Scan the code of main + every release tag → one openapi.json per version
      - name: Build versioned docs site
        run: bash scripts/build-site.sh

      # 2. Publish site/ (Scalar page + versions/*.json) to GitHub Pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
