name: API docs

# Every push to main regenerates openapi.json from the code and redeploys the docs site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 1. Scan the code → openapi.json (version = short commit SHA)
      - name: Generate openapi.json
        run: API_VERSION="1.0.0+${GITHUB_SHA::7}" npm run docs:generate

      # 2. Publish docs/ (index.html with Scalar + openapi.json) to GitHub Pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
